<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TULISIN AJA - AI Prompt Generator Catatan Tangan</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #f4f7f9;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background-color: #0d4a8e;
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0;
            font-size: 2.5em;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        header p {
            margin: 5px 0 0;
            font-size: 1.1em;
            font-weight: 300;
        }

        /* Tool Interface Section */
        .tool-panel {
            background-color: white;
            border-radius: 15px;
            padding: 30px;
            margin-top: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }

        .form-group textarea {
            width: 100%;
            height: 80px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1em;
            resize: vertical;
            box-sizing: border-box;
        }

        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            box-sizing: border-box;
        }

        .generate-btn {
            background-color: #f7b731;
            color: #333;
            border: none;
            padding: 15px 30px;
            font-size: 1.3em;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 6px rgba(247, 183, 49, 0.4);
            transition: all 0.2s;
        }

        .generate-btn:hover {
            background-color: #ef9f1f;
            transform: translateY(-2px);
        }

        /* Output Area */
        .output-panel {
            border: 2px dashed #0d4a8e;
            border-radius: 15px;
            padding: 20px;
            background-color: #e8f4fd;
            display: none;
            flex-direction: column;
            gap: 15px;
        }

        .output-panel h3 {
            margin: 0;
            color: #0d4a8e;
            text-align: center;
        }

        .prompt-result {
            background-color: #fff;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #b6d4fe;
            font-family: monospace;
            font-size: 1.1em;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .action-btn {
            background-color: #2e7d32;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1em;
            text-align: center;
            transition: background-color 0.2s;
        }

        .action-btn:hover {
            background-color: #1b5e20;
        }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>✒️ TULISIN AJA</h1>
        <p>Penghasil Prompt Visual Catatan Tangan Realistis</p>
    </header>

    <div class="tool-panel">
        <div class="input-controls">
            <div class="form-group">
                <label for="topicInput">Topik Konten (contoh: "Inflasi untuk pemula")</label>
                <textarea id="topicInput" placeholder="Ketik topik materi di sini..."></textarea>
            </div>
            <div class="form-group">
                <label for="ratioSelect">Pilih Aspek Rasio</label>
                <select id="ratioSelect">
                    <option value="--ar 9:16">9:16 (Vertikal - TikTok/Reels/Shorts)</option>
                    <option value="--ar 1:1">1:1 (Kotak - Instagram Post)</option>
                    <option value="--ar 16:9">16:9 (Horizontal - YouTube/Presentasi)</option>
                </select>
            </div>
            <button class="generate-btn" id="generateBtn">BUAT PROMPT SEKARANG ⚡</button>
        </div>

        <div class="output-panel" id="outputPanel">
            <h3>👇🏻 Salin Prompt Ini & Tempel di AI Gambar 👇🏻</h3>
            <div class="prompt-result" id="promptResult"></div>
            <button class="action-btn" id="copyBtn">📋 Salin Teks Prompt</button>
        </div>
    </div>
</div>

<script>
    document.getElementById('generateBtn').addEventListener('click', function() {
        const topic = document.getElementById('topicInput').value.trim();
        const ratio = document.getElementById('ratioSelect').value;
        const outputPanel = document.getElementById('outputPanel');
        const promptResult = document.getElementById('promptResult');

        if (!topic) {
            alert('Harap isi topik konten terlebih dahulu!');
            return;
        }

        // Template Prompt Super Detail dengan sentuhan visual kopi
        const promptText = `A top-down realistic flatlay photography of an open spiral notebook lying on a clean modern wooden desk. The pages of the notebook contain neat, aesthetic handwritten notes, colorful educational mind maps, arrows, text boxes, and small doodles explaining the topic: "${topic}". The handwriting is perfectly legible, written with black ink, blue markers, and highlighted with yellow highlighters. A ceramic mug of black coffee with rising steam is visible on the edge of the desk. Photorealistic, 8k resolution, highly detailed, bright natural studio lighting. ${ratio}`;

        promptResult.textContent = promptText;
        outputPanel.style.display = 'flex';
    });

    // Fungsi Salin (Copy) dengan mekanisme Fallback
    document.getElementById('copyBtn').addEventListener('click', function() {
        const textToCopy = document.getElementById('promptResult').textContent;

        if (navigator.clipboard && window.isSecureContext) {
            // Metode utama (Modern API)
            navigator.clipboard.writeText(textToCopy).then(function() {
                alert('Berhasil disalin! Sekarang tinggal di-paste ke AI kesayanganmu.');
            }, function(err) {
                fallbackCopyTextToClipboard(textToCopy);
            });
        } else {
            // Metode Fallback untuk browser dengan batasan clipboard
            fallbackCopyTextToClipboard(textToCopy);
        }
    });

    function fallbackCopyTextToClipboard(text) {
        var textArea = document.createElement("textarea");
        textArea.value = text;
        
        // Sembunyikan textarea dari pandangan
        textArea.style.top = "0";
        textArea.style.left = "0";
        textArea.style.position = "fixed";
        textArea.style.opacity = "0";

        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();

        try {
            var successful = document.execCommand('copy');
            if(successful) {
                alert('Teks berhasil disalin (Mode Fallback aktif)! Silakan paste di AI Gambar.');
            } else {
                alert('Ups, gagal menyalin secara otomatis. Silakan blok teksnya dan salin secara manual.');
            }
        } catch (err) {
            alert('Browser kamu tidak mendukung fitur salin otomatis. Silakan salin teks secara manual.');
        }

        document.body.removeChild(textArea);
    }
</script>

</body>
</html>
