<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POSTER DAKWAH PRO - Generator Visual & Motion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            margin: 0;
            background-color: #fafafa; /* Latar belakang putih bersih/abu sangat terang */
            color: #475569;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        .kicker-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85em;
            font-weight: 700;
            color: #d97706; /* Warna aksen emas/mustard */
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: block;
        }

        header h1 {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            font-size: 2.8em;
            font-weight: 900;
            color: #1e293b; /* Warna Dark Navy / Biru Dongker Pekat */
            line-height: 1.2;
            letter-spacing: -1px;
        }

        header p {
            margin: 15px auto 0;
            font-size: 1.1em;
            color: #64748b;
            max-width: 600px;
        }

        /* Tool Interface Section */
        .tool-panel {
            background-color: #ffffff;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.04);
            border: 1px solid #f1f5f9;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group label {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            display: block;
            margin-bottom: 10px;
            color: #1e293b;
            font-size: 0.9em;
        }

        .form-group input[type="text"], .form-group select {
            width: 100%;
            padding: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1.05em;
            box-sizing: border-box;
            background-color: #f8fafc;
            color: #0f172a;
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
            transition: border-color 0.3s;
            outline: none;
        }

        .form-group input[type="text"]:focus, .form-group select:focus {
            border-color: #1e293b;
        }

        .form-group select {
            cursor: pointer;
        }

        .generate-btn {
            background-color: #1e293b; /* Tombol utama warna Dark Navy */
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            border: none;
            padding: 18px 30px;
            font-size: 1.1em;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 10px 20px rgba(30, 41, 59, 0.15);
            transition: all 0.2s;
            margin-top: 15px;
            letter-spacing: 0.5px;
        }

        .generate-btn:hover {
            background-color: #0f172a;
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(30, 41, 59, 0.2);
        }

        /* Output Area */
        .output-panel {
            border: 2px dashed #cbd5e1;
            border-radius: 20px;
            padding: 30px;
            background-color: #f8fafc;
            display: none;
            flex-direction: column;
            gap: 25px;
            margin-top: 10px;
        }

        .prompt-section h3 {
            font-family: 'Montserrat', sans-serif;
            margin: 0 0 15px 0;
            color: #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.05em;
            font-weight: 800;
        }

        .prompt-result {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            font-family: Consolas, Monaco, monospace;
            font-size: 0.95em;
            line-height: 1.7;
            white-space: pre-wrap;
            color: #334155;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .action-btn {
            background-color: #f1f5f9;
            color: #1e293b;
            font-family: 'Montserrat', sans-serif;
            padding: 10px 20px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85em;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background-color: #e2e8f0;
            border-color: #94a3b8;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            header h1 {
                font-size: 2.2em;
            }
            .tool-panel {
                padding: 25px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <span class="kicker-text">Bonus NPA Smart System</span>
        <h1>Poster Dakwah Pro</h1>
        <p>Gunakan prompt di bawah ini ke AI Gambar dan AI Video favoritmu untuk mengubah ide menjadi poster statis dan bergerak secara instan.</p>
    </header>

    <div class="tool-panel">
        <div class="form-group">
            <label for="topicInput">Topik Kajian / Dakwah (Contoh: Bahaya Ghibah)</label>
            <input type="text" id="topicInput" placeholder="Ketik topik poster di sini...">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="styleSelect">Gaya Ilustrasi Karakter</label>
                <select id="styleSelect">
                    <option value="high quality Anime style illustration, detailed shading">Gaya Anime (Jepang)</option>
                    <option value="semi-realistic 3D rendering, octane render, soft lighting">Gaya 3D (Semi-Realistis)</option>
                    <option value="minimalist flat vector illustration, clean lines">Gaya Vektor Minimalis</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="ratioSelect">Pilih Aspek Rasio</label>
                <select id="ratioSelect">
                    <option value="--ar 4:5">4:5 (Instagram Feed Estetik)</option>
                    <option value="--ar 9:16">9:16 (Motion Poster Vertikal)</option>
                </select>
            </div>
        </div>

        <button class="generate-btn" id="generateBtn">Generate Prompt</button>
        
        <div class="output-panel" id="outputPanel">
            <!-- Output Poster Statis -->
            <div class="prompt-section">
                <h3>
                    <span>1. PROMPT GAMBAR (Statis)</span>
                    <button class="action-btn" onclick="copyText('promptImage')">Salin Teks</button>
                </h3>
                <div class="prompt-result" id="promptImage"></div>
            </div>

            <!-- Output Motion Poster -->
            <div class="prompt-section">
                <h3>
                    <span>2. PROMPT VIDEO (Animasi Motion)</span>
                    <button class="action-btn" onclick="copyText('promptVideo')">Salin Teks</button>
                </h3>
                <div class="prompt-result" id="promptVideo"></div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('generateBtn').addEventListener('click', function() {
        const topic = document.getElementById('topicInput').value.trim();
        const style = document.getElementById('styleSelect').value;
        const ratio = document.getElementById('ratioSelect').value;
        
        if (!topic) {
            alert('Silakan isi topik dakwahnya terlebih dahulu.');
            return;
        }

        // 1. Generate Prompt Gambar (Poster Statis)
        const imagePrompt = `A stunning Islamic aesthetic poster about "${topic}". ${style}. The main focus is a relatable young character expressing the theme. The background contains highly detailed symbolic elements related to the topic, with dramatic atmospheric lighting (cinematic lighting, glowing accents). There is clear negative space at the top and bottom with beautiful bold typography elements integrated into the design. High contrast, highly detailed, visually striking, 8k resolution. ${ratio}`;

        // 2. Generate Prompt Motion (Video AI Animasi)
        const videoPrompt = `Cinemagraph motion poster effect. The main character in the poster has subtle idle movements, like breathing gently. Hair and clothes are swaying slightly in a soft breeze. The atmospheric lighting in the background is dynamic, with glowing particles floating slowly in the air. Smooth, seamless looping animation, ultra-realistic motion, 4k 60fps.`;

        document.getElementById('promptImage').textContent = imagePrompt;
        document.getElementById('promptVideo').textContent = videoPrompt;
        
        document.getElementById('outputPanel').style.display = 'flex';
    });

    // Fungsi Salin (Copy) dengan Fallback Mechanism
    function copyText(elementId) {
        const textToCopy = document.getElementById(elementId).textContent;

        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(textToCopy).then(function() {
                alert('Teks berhasil disalin!');
            }, function(err) {
                fallbackCopy(textToCopy);
            });
        } else {
            fallbackCopy(textToCopy);
        }
    }

    function fallbackCopy(text) {
        var textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.top = "0";
        textArea.style.left = "0";
        textArea.style.position = "fixed";
        textArea.style.opacity = "0";

        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();

        try {
            var successful = document.execCommand('copy');
            if(successful) {
                alert('Teks berhasil disalin!');
            } else {
                alert('Gagal menyalin otomatis. Silakan salin manual.');
            }
        } catch (err) {
            alert('Browser tidak mendukung copy otomatis. Silakan salin manual.');
        }
        document.body.removeChild(textArea);
    }
</script>

</body>
</html>
